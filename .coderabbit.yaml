# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
  path_filters:
    - "!**/node_modules/**"
    - "!**/build/**"
    - "!**/.next/**"
  path_instructions:
    - path: "**/*"
      instructions: >-
        기관 전환이나 로그아웃 뒤 이전 기관의 예약·출입증·출입 이력이 화면이나 캐시에 남는지 확인하세요.
        기관 전환 전에 시작한 요청의 응답이 새 기관 화면을 덮어쓰는지도 검토하세요.
        메뉴와 버튼의 표시 조건이 API 권한 및 예약·출입증 상태와 일치하는지 확인하고, 권한 부족·세션 만료·충돌·요청 실패를 성공으로 표시하는 변경을 지적하세요.
        승인·폐기 같은 작업은 중복 제출을 막고, 성공 후 목록과 상세 화면이 같은 상태를 보여주는지 확인하세요.
        화면과 로그에 불필요한 개인정보가 노출되는지도 살피세요.
chat:
  auto_reply: true
